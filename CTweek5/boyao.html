<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Drink</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 24px;
      background: #f8f4ec;
      color: #263d32;
      font-family: system-ui, sans-serif;
    }
    main { width: 100%; max-width: 560px; margin: 0 auto; }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 7vw, 3rem); }
    p { line-height: 1.6; }
    button {
      padding: 14px 36px;
      border: 0;
      border-radius: 999px;
      background: #263d32;
      color: white;
      font: inherit;
      font-size: 1.1rem;
      cursor: pointer;
    }
    button:hover { background: #3c5b48; }
    button:focus-visible { outline: 3px solid #bd681f; outline-offset: 4px; }
    button:disabled { opacity: 0.6; cursor: wait; }
    #status { min-height: 1.6em; }
    article { padding: 24px; background: white; border-radius: 20px; }
    img { display: block; width: 100%; border-radius: 12px; }
    h2 { font-size: 1.8rem; }
    li { padding-bottom: 6px; }
    #instructions { white-space: pre-line; }
    #apod { margin-top: 32px; padding-top: 24px; border-top: 1px solid #ddd; }
    #apod h3 { margin-top: 0; }
    #apod-image { margin-top: 16px; }
    #apod-credit { font-size: 0.85rem; }
    footer { margin-top: 24px; font-size: 0.8rem; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Random drink</h1>
    <p>One click. A new recipe to discover.</p >
    <button id="start" type="button">start</button>
    <p id="status" role="status" aria-live="polite"></p >

    <article id="drink" aria-label="Drink recipe" hidden>
      <img id="photo" alt="" hidden>
      <h2 id="name"></h2>
      <p id="details"></p >
      <h3>Ingredients</h3>
      <ul id="ingredients"></ul>
      <h3>Instructions</h3>
      <p id="instructions"></p >

      <section id="apod" aria-label="Astronomy Picture of the Day" hidden>
        <h3>Astronomy Picture of the Day</h3>
        <p id="apod-date"></p >
        <h4 id="apod-title"></h4>
        <img id="apod-image" alt="" hidden>
        <p id="apod-message"></p >
        <p id="apod-credit"></p >
        <a id="apod-link" href="" target="_blank" rel="noopener noreferrer" hidden>View on NASA</a >
      </section>
    </article>

    <footer>Recipes from <a href=" ">TheCocktailDB</a ></footer>
  </main>

  <script>
    const startButton = document.getElementById('start');
    const status = document.getElementById('status');
    const drinkCard = document.getElementById('drink');
    const apodSection = document.getElementById('apod');
    const apodEndpoint = location.port === '8000'
      ? '/api/apod'
      : 'http://127.0.0.1:8000/api/apod';

    startButton.addEventListener('click', async () => {
      startButton.disabled = true;
      status.textContent = 'Finding a random drink…';
      drinkCard.hidden = true;
      apodSection.hidden = true;

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);

      try {
        // TheCocktailDB's development/educational key is "1".
        const response = await fetch(
          'https://www.thecocktaildb.com/api/json/v1/1/random.php',
          { signal: controller.signal }
        );

        if (!response.ok) throw new Error('The API request failed.');

        const data = await response.json();
        const drink = data.drinks?.[0];
        if (!drink?.strDrink) throw new Error('No drink was returned.');

        document.getElementById('name').textContent = drink.strDrink;
        document.getElementById('details').textContent =
          [drink.strCategory, drink.strAlcoholic, drink.strGlass].filter(Boolean).join(' · ');
        document.getElementById('instructions').textContent =
          drink.strInstructions || 'No instructions available.';

        const photo = document.getElementById('photo');
        photo.hidden = true;
        photo.onload = () => { photo.hidden = false; };
        photo.onerror = () => { photo.hidden = true; };
        photo.removeAttribute('src');
        photo.alt = drink.strDrink;
        if (drink.strDrinkThumb) photo.src = drink.strDrinkThumb;

        const ingredients = document.getElementById('ingredients');
        ingredients.replaceChildren();
        for (let i = 1; i <= 15; i++) {
          const ingredient = drink[`strIngredient${i}`]?.trim();
          const measure = drink[`strMeasure${i}`]?.trim();
          if (ingredient) {
            const item = document.createElement('li');
            item.textContent = [measure, ingredient].filter(Boolean).join(' ');
            ingredients.appendChild(item);
          }
        }

        drinkCard.hidden = false;
        const apodMessage = document.getElementById('apod-message');
        const apodImage = document.getElementById('apod-image');
        const apodLink = document.getElementById('apod-link');
        document.getElementById('apod-date').textContent = '';
        document.getElementById('apod-title').textContent = '';
        document.getElementById('apod-credit').textContent = '';
        apodMessage.textContent = '';
        apodImage.hidden = true;
        apodImage.removeAttribute('src');
        apodLink.hidden = true;
        apodLink.removeAttribute('href');
        apodSection.hidden = false;

        try {
          status.textContent = 'Drink ready. Finding a random NASA picture…';
          const apodResponse = await fetch(apodEndpoint, {
            cache: 'no-store',
            signal: controller.signal
          });
          if (!apodResponse.ok) throw new Error('The NASA APOD request failed.');

          const apod = await apodResponse.json();
          if (!apod.title || !apod.imageUrl) throw new Error('NASA returned incomplete APOD data.');

          document.getElementById('apod-date').textContent = apod.date || '';
          document.getElementById('apod-title').textContent = apod.title;
          apodMessage.textContent = apod.explanation || '';
          apodLink.href = apod.sourceUrl || 'https://science.nasa.gov/apod/';
          apodLink.hidden = false;
          apodImage.alt = apod.title;
          apodImage.onload = () => { apodImage.hidden = false; };
          apodImage.onerror = () => {
            apodImage.hidden = true;
            apodMessage.textContent = 'The astronomy image could not be displayed. View it on NASA instead.';
          };
          apodImage.src = apod.imageUrl;
          status.textContent = 'Your random drink is ready. Click start for another.';
        } catch (error) {
          apodMessage.textContent = 'Could not load a random NASA picture.';
          status.textContent = 'Your random drink is ready. Click start for another.';
          console.error(error);
        }
      } catch (error) {
        status.textContent = 'Could not load a drink. Please click start to try again.';
        console.error(error);
      } finally {
        clearTimeout(timeout);
        startButton.disabled = false;
      }
    });
  </script>
</body>
</html>
