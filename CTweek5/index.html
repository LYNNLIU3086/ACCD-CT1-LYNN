<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e9">
  <title>Image Loop</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f0e9;
      --ink: #20231f;
      --accent: #d5fa56;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      color: var(--ink);
      background: var(--paper);
      font-family: "Helvetica Neue", Helvetica, sans-serif;
    }

    main {
      position: relative;
      display: grid;
      min-height: calc(100vh - 48px);
      overflow: hidden;
      place-items: center;
      background: #d9d8d1;
    }

    .photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 240ms ease;
    }

    .photo.is-loading { opacity: 0.45; }

    .topbar {
      position: absolute;
      z-index: 1;
      top: 22px;
      left: 22px;
      right: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .start-button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      border: 0;
      border-radius: 2px;
      color: var(--ink);
      background: var(--accent);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease;
    }

    .start-button:hover { background: #e1ff83; transform: translateY(-1px); }
    .start-button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    .start-button:disabled { cursor: wait; opacity: 0.8; }

    .arrow { font-size: 18px; line-height: 1; }

    .counter {
      padding: 10px 12px;
      color: white;
      background: rgb(20 22 19 / 58%);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.08em;
    }

    .caption {
      position: absolute;
      right: 24px;
      bottom: 22px;
      left: 24px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      color: white;
      text-shadow: 0 1px 12px rgb(0 0 0 / 45%);
    }

    .caption h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 6vw, 72px);
      font-weight: 400;
      line-height: 0.95;
    }

    .caption p {
      margin: 0;
      font-size: 12px;
      text-align: right;
    }

    @media (max-width: 560px) {
      body { padding: 10px; }
      main { min-height: calc(100vh - 20px); }
      .topbar { top: 14px; left: 14px; right: 14px; }
      .caption { right: 16px; bottom: 16px; left: 16px; align-items: start; flex-direction: column; }
      .caption p { text-align: left; }
    }
  </style>
</head>
<body>
  <main aria-label="随机图片浏览器">
    <img class="photo" src="https://www.thecocktaildb.com/images/media/drink/smb2oe1582479072.jpg" alt="Abilene cocktail">
    <div class="topbar">
      <button class="start-button" type="button">
        <span>START</span><span class="arrow" aria-hidden="true">↗</span>
      </button>
      <span class="counter" aria-live="polite">VIEW 01</span>
    </div>
    <div class="caption">
      <h1>Abilene</h1>
      <p>COCKTAILDB RANDOM PICK</p>
    </div>
  </main>
  <script>
    const photo = document.querySelector(".photo");
    const button = document.querySelector(".start-button");
    const counter = document.querySelector(".counter");
    let imageNumber = 1;
    let currentCocktailId = "17835";

    function preloadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
    }

    button.addEventListener("click", async () => {
      button.disabled = true;
      photo.classList.add("is-loading");
      counter.textContent = "LOADING...";

      try {
        let cocktail;
        for (let attempt = 0; attempt < 5; attempt += 1) {
          const response = await fetch("https://www.thecocktaildb.com/api/json/v1/1/random.php");
          if (!response.ok) throw new Error("Cocktail API request failed");
          const data = await response.json();
          cocktail = data.drinks?.[0];
          if (!cocktail?.idDrink || !cocktail.strDrinkThumb) {
            throw new Error("No cocktail image returned");
          }
          if (cocktail.idDrink !== currentCocktailId) break;
          cocktail = null;
        }

        if (!cocktail) throw new Error("No new cocktail returned");
        await preloadImage(cocktail.strDrinkThumb);
        photo.src = cocktail.strDrinkThumb;
        photo.alt = `${cocktail.strDrink} cocktail`;
        document.querySelector(".caption h1").textContent = cocktail.strDrink;
        currentCocktailId = cocktail.idDrink;
        imageNumber += 1;
        counter.textContent = `VIEW ${String(imageNumber).padStart(2, "0")}`;
      } catch (error) {
        counter.textContent = "TRY AGAIN";
      } finally {
        photo.classList.remove("is-loading");
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
