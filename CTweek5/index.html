<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e9">
  <title>Image Loop</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f0e9;
      --ink: #202720;
      --muted: #626b63;
      --accent: #d5fa56;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      padding: 24px;
      color: var(--ink);
      background: var(--paper);
      font-family: "Helvetica Neue", Helvetica, sans-serif;
    }

    .apod-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(340px, 0.8fr);
      min-height: calc(100svh - 48px);
      background: var(--paper);
    }

    .photo-panel {
      position: relative;
      min-width: 0;
      min-height: 620px;
      overflow: hidden;
      background: #27312b;
    }

    .photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 240ms ease;
    }

    .photo-panel::after {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgb(18 25 21 / 38%), transparent 28%, transparent 74%, rgb(18 25 21 / 14%));
      content: "";
      pointer-events: none;
    }

    .photo.is-loading { opacity: 0.5; }

    .photo-controls {
      position: absolute;
      z-index: 1;
      top: 22px;
      right: 22px;
      left: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .start-button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      border: 0;
      border-radius: 2px;
      color: var(--ink);
      background: var(--accent);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease;
    }

    .start-button:hover { background: #e1ff83; transform: translateY(-1px); }
    .start-button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    .start-button:disabled { cursor: wait; opacity: 0.8; }

    .arrow { font-size: 18px; line-height: 1; }

    .counter {
      padding: 10px 12px;
      color: white;
      background: rgb(20 22 19 / 58%);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.08em;
    }

    .caption {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 72px 52px 48px;
      background: var(--paper);
      animation: reveal 420ms ease both;
    }

    .caption-kicker {
      color: #61745f;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1.5;
    }

    .caption-date {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 36px 0 24px;
      color: var(--muted);
      font-size: 13px;
    }

    .caption-date::before {
      width: 26px;
      height: 1px;
      background: #8d9c83;
      content: "";
    }

    .caption h1 {
      max-width: 100%;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 48px;
      font-weight: 400;
      line-height: 1.04;
      overflow-wrap: anywhere;
    }

    .caption-description {
      margin: 24px 0 0;
      color: #4e5951;
      font-size: 15px;
      line-height: 1.75;
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 34px;
      padding-bottom: 5px;
      border-bottom: 1px solid #9ba694;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    .source-link:hover { border-color: var(--ink); }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 900px) {
      body { padding: 16px; }
      .apod-layout {
        grid-template-columns: minmax(0, 1.05fr) minmax(300px, 0.95fr);
        min-height: calc(100svh - 32px);
      }
      .photo-panel { min-height: 600px; }
      .caption { padding: 64px 32px 40px; }
      .caption h1 { font-size: 40px; }
    }

    @media (max-width: 680px) {
      body { padding: 10px; }
      .apod-layout {
        grid-template-columns: minmax(0, 1fr);
        min-height: calc(100svh - 20px);
      }
      .photo-panel { min-height: 52svh; }
      .photo-controls { top: 14px; right: 14px; left: 14px; }
      .caption { padding: 34px 24px 42px; }
      .caption-date { margin: 24px 0 18px; }
      .caption h1 { font-size: 36px; }
      .caption-description { margin-top: 18px; }
      .source-link { margin-top: 26px; }
    }
  </style>
</head>
<body>
  <main class="apod-layout" aria-label="NASA 每日天文图片">
    <section class="photo-panel" aria-label="APOD 图片">
      <img class="photo" alt="NASA 天文图片">
      <div class="photo-controls">
        <button class="start-button" type="button">
          <span>START</span><span class="arrow" aria-hidden="true">↗</span>
        </button>
        <span class="counter" aria-live="polite">NASA APOD</span>
      </div>
    </section>
    <article class="caption" aria-live="polite">
      <div class="caption-kicker">ASTRONOMY PICTURE OF THE DAY</div>
      <div class="caption-date"><time>Loading date</time></div>
      <h1>NASA APOD</h1>
      <p class="caption-description">Loading the story behind this image...</p>
      <a class="source-link" href="https://science.nasa.gov/apod/" target="_blank" rel="noreferrer">
        <span>OPEN NASA APOD</span><span aria-hidden="true">↗</span>
      </a>
    </article>
  </main>
  <script>
    const photo = document.querySelector(".photo");
    const button = document.querySelector(".start-button");
    const counter = document.querySelector(".counter");
    const apodEndpoint = location.port === "8000"
      ? "/api/apod"
      : "http://127.0.0.1:8000/api/apod";
    const seenImages = new Set();
    let imageNumber = 0;

    function preloadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        const timeoutId = setTimeout(() => reject(new Error("Image load timed out")), 12000);
        image.onload = () => {
          clearTimeout(timeoutId);
          resolve(image);
        };
        image.onerror = () => {
          clearTimeout(timeoutId);
          reject(new Error("Image failed to load"));
        };
        image.src = src;
      });
    }

    async function loadNextApod() {
      button.disabled = true;
      photo.classList.add("is-loading");
      counter.textContent = "LOADING...";

      try {
        const response = await fetch(apodEndpoint, { cache: "no-store" });
        if (!response.ok) throw new Error("APOD request failed");
        const apod = await response.json();
        if (!apod.title || !apod.imageUrl) throw new Error("APOD data is incomplete");
        if (seenImages.has(apod.imageUrl)) throw new Error("Duplicate APOD image");
        await preloadImage(apod.imageUrl);

        photo.src = apod.imageUrl;
        photo.alt = apod.title;
        document.querySelector(".caption h1").textContent = apod.title;
        document.querySelector(".caption-date time").textContent = apod.date;
        document.querySelector(".caption-description").textContent = apod.explanation;
        document.querySelector(".source-link").href = apod.sourceUrl;
        seenImages.add(apod.imageUrl);
        imageNumber += 1;
        counter.textContent = `VIEW ${String(imageNumber).padStart(2, "0")}`;
      } catch (error) {
        counter.textContent = "TRY AGAIN";
      } finally {
        photo.classList.remove("is-loading");
        button.disabled = false;
      }
    }

    button.addEventListener("click", loadNextApod);
    loadNextApod();
  </script>
</body
</html>
