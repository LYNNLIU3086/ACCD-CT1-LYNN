<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Urban Layers - Unified Interface</title>
    <style>
        :root { 
            --main-green: #2ecc71; 
            --deep-green: #27ae60;
            --accent-green: #e8f8f1;
            --bg-white: #f8faf9;
            --panel-bg: rgba(255, 255, 255, 0.4); /* 统一背板透明度 */
            --text-dark: #2c3e50;
        }
        body { 
            margin: 0; 
            background-color: var(--bg-white); 
            overflow: hidden; 
            font-family: "SF Pro Display", "Helvetica Neue", Arial, sans-serif; 
            color: var(--text-dark); 
        }

        /* --- 顶部标题 --- */
        #top-info {
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
            text-align: center; z-index: 5; pointer-events: none;
        }
        #top-info h1 { 
            font-size: 24px; letter-spacing: 12px; margin: 0; 
            font-weight: 300; text-transform: uppercase;
            color: var(--deep-green); opacity: 0.7;
        }

        #exit-btn {
            position: absolute; top: 30px; left: 30px; cursor: pointer; opacity: 0; scale: 0.8;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 25;
            display: flex; align-items: center; justify-content: center;
            width: 48px; height: 48px; border-radius: 50%; background: #ffffff; 
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.1); border: 1px solid var(--accent-green); pointer-events: none;
        }
        #exit-btn svg { width: 22px; height: 22px; fill: var(--main-green); transform: rotate(90deg); }

        /* --- 数据面板 --- */
        #data-panel {
            position: absolute; top: 120px; left: 50px; background: rgba(255,255,255,0.8); padding: 20px; 
            border-radius: 12px; border: 1px solid var(--accent-green); display: none; z-index: 20;
            backdrop-filter: blur(10px); width: 220px;
        }
        #data-panel h2 { font-size: 10px; color: var(--deep-green); margin: 0 0 10px 0; letter-spacing: 2px; }
        .data-item { font-family: 'Courier New', monospace; font-size: 12px; margin: 6px 0; display: flex; justify-content: space-between; color: #7f8c8d; }
        .data-item b { color: var(--deep-green); }

        /* --- 统一滑块样式 --- */
.range-slider {
  -webkit-appearance: none; /* Chrome, Safari, Edge */
  -moz-appearance: none;    /* Firefox */
  appearance: none;
  width: 100%;
  height: 4px;
  background: transparent;
  outline: none;
  cursor: pointer;
}

/* ===== 轨道 ===== */
.range-slider::-webkit-slider-runnable-track {
  width: 100%;
  height: 4px;
  background: rgba(46, 204, 113, 0.2);
  border-radius: 4px;
}

.range-slider::-moz-range-track {
  width: 100%;
  height: 4px;
  background: rgba(46, 204, 113, 0.2);
  border-radius: 4px;
}

/* ===== 滑块 ===== */
.range-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--main-green);
  border: 3px solid #fff;
  box-shadow: 0 2px 8px rgba(46, 204, 113, 0.3);
  margin-top: -8px; /* 居中对齐轨道 */
  cursor: pointer;
  transition: transform 0.2s ease;
}

.range-slider::-webkit-slider-thumb:hover {
  transform: scale(1.1);
}

.range-slider::-webkit-slider-thumb:active {
  transform: scale(1.2);
}

/* Firefox */
.range-slider::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--main-green);
  border: 3px solid #fff;
  box-shadow: 0 2px 8px rgba(46, 204, 113, 0.3);
  cursor: pointer;
  transition: transform 0.2s ease;
}

.range-slider::-moz-range-thumb:hover {
  transform: scale(1.1);
}

.range-slider::-moz-range-thumb:active {
  transform: scale(1.2);
}

        /* --- 底部时间轴 (风格基准) --- */
        #timeline-container {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 85%; display: flex; flex-direction: column; align-items: center; gap: 10px;

            border: 1px solid var(--main-green); display: none; white-space: nowrap;
        }
    </style>
</head>

            geo.setAttribute('aYear', new THREE.Float32BufferAttribute(years, 1));
            points = new THREE.Points(geo, temporalMaterial);
            scene.add(points);
        }
        createPoints(12000);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const markDiv = document.getElementById('mark-container');
        const probeMark = new CSS2DObject(markDiv);
        scene.add(probeMark);

        let isZoomed = false;
        const uiLayer = document.getElementById('ui-layer');

        window.addEventListener('click', (e) => {
            if (isZoomed || e.target.closest('input') || e.target.closest('#exit-btn')) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(wireGlobe);
            if (intersects.length > 0) {
                const point = intersects[0].point;
                isZoomed = true; controls.autoRotate = false;
                uiLayer.classList.add('active');
                gsap.to('#exit-btn', { opacity: 1, scale: 1, duration: 0.4, pointerEvents: 'auto' });
                document.getElementById('data-panel').style.display = 'block';
                markDiv.style.display = 'block';
                probeMark.position.copy(point.clone().multiplyScalar(1.02));
                const sph = new THREE.Spherical().setFromVector3(point);
                document.getElementById('p-lat').innerText = (90 - THREE.MathUtils.radToDeg(sph.phi)).toFixed(2);
                document.getElementById('p-lon').innerText = (THREE.MathUtils.radToDeg(sph.theta)).toFixed(2);
                gsap.to(camera.position, { x: point.x*1.3, y: point.y*1.3, z: point.z*1.3, duration: 1.2, ease: "power3.inOut" });
                gsap.to(controls.target, { x: point.x, y: point.y, z: point.z, duration: 1.2 });
            }
        });

        document.getElementById('exit-btn').onclick = () => {
            isZoomed = false;
            uiLayer.classList.remove('active');
            gsap.to('#exit-btn', { opacity: 0, scale: 0.8, duration: 0.4, pointerEvents: 'none' });
            document.getElementById('data-panel').style.display = 'none';
            markDiv.style.display = 'none';
            gsap.to(camera.position, { x: 0, y: 0, z: 5, duration: 1.2, ease: "expo.inOut" });
            gsap.to(controls.target, { x: 0, y: 0, z: 0, duration: 1.2, onComplete: () => controls.autoRotate = true });
        };

        // UI Listeners
        document.getElementById('density').oninput = (e) => createPoints(parseInt(e.target.value));
        document.getElementById('timeline').oninput = (e) => {
            const val = parseFloat(e.target.value);
            temporalMaterial.uniforms.uCurrentYear.value = val;
            document.getElementById('display-year').innerText = Math.floor(val);
            document.getElementById('display-year-large').innerText = Math.floor(val);
        };
        document.getElementById('focus-strength').oninput = (e) => {
            temporalMaterial.uniforms.uScanner.value = parseFloat(e.target.value);
        };

        function animate() {
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
