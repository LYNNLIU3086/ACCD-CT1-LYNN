<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbital Drift – Interactive Exhibition Version by Liu</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script src="sketch.js" defer></script>

  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at 50% 30%, #070719 0%, #020212 100%);
      color: #e8ebff;
      font-family: "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      font-size: 3em;
      background: linear-gradient(90deg, #a2b7ff, #ff9ebc, #a2b7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 40px;
    }

    .controls {
      text-align: center;
      margin: 20px 0;
      position: relative;
      z-index: 10;
    }
    .controls button {
      font-size: 1rem;
      margin: 0 10px;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: linear-gradient(90deg, #a2b7ff, #ff9ebc);
      color: #fff;
      transition: transform 0.2s ease;
    }
    .controls button:hover {
      transform: scale(1.05);
    }

    #sketch-holder {
      width: 100%;
      height: 60vh;
      display: flex;
      justify-content: center;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.1);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .iterations {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 30px 0;
    }
    .iteration {
      margin: 10px;
      text-align: center;
      width: 180px;
    }
    .iteration img {
      width: 100%;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.2);
    }
    .iteration p {
      margin-top: 6px;
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>
</head>

<body>
  <h1>🌌 Orbital Drift – Interactive Version</h1>

  <div class="controls">
    <button id="pauseBtn">Pause</button>
    <button id="toggleTrailBtn">Toggle Trail</button>
    <button id="randomColorBtn">Random Colors</button>
    <button id="randomParamsBtn">Random Orbit & Speed</button>
  </div>

  <div id="sketch-holder"></div>

  <div class="iterations">
    <div class="iteration">
      <img src="images/iteration1.png" alt="Iteration 1">
      <p>初步设计，确定中心恒星与行星轨道</p>
    </div>
    <div class="iteration">
      <img src="images/iteration2.png" alt="Iteration 2">
      <p>添加卫星漂移，轨迹开始出现</p>
    </div>
    <div class="iteration">
      <img src="images/iteration3.png" alt="Iteration 3">
      <p>加入 Perlin 噪声让行星和卫星更有机</p>
    </div>
    <div class="iteration">
      <img src="images/iteration4.png" alt="Iteration 4">
      <p>轨迹线优化，行星光晕调整</p>
    </div>
    <div class="iteration">
      <img src="images/iteration5.png" alt="Iteration 5">
      <p>增加随机星空点，动态更丰富</p>
    </div>
    <div class="iteration">
      <img src="images/iteration6.png" alt="Iteration 6">
      <p>完成互动控制按钮，颜色与轨道随机化</p>
    </div>
  </div>
</body>
</html>
