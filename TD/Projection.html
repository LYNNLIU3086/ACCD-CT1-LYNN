<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projection Mapping — TouchDesigner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #999;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.8;
    }

    nav {
      padding: 32px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav a {
      color: #444;
      text-decoration: none;
      transition: color 0.2s;
    }
    nav a:hover { color: #999; }

    /* ── Hero ── */
    .detail-hero {
      margin: 0 40px 60px;
      width: calc(100% - 80px);
      aspect-ratio: 16/6;
      background: #111;
      overflow: hidden;
    }
    .detail-hero video, .detail-hero img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Single column ── */
    .detail-body {
      margin: 0 40px;
      max-width: 720px;
      padding-bottom: 100px;
    }

    .detail-index { color: #333; margin-bottom: 8px; }
    .detail-title {
      font-size: 22px;
      color: #ccc;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }
    .detail-desc { color: #666; margin-bottom: 40px; }

    .media-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      margin-bottom: 2px;
    }
    .media-row video, .media-row img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: #111;
    }
    .media-single { margin-bottom: 2px; }
    .media-single video, .media-single img,
    .media-single .effect-media img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      background: #111;
    }
    .media-caption { color: #333; margin-top: 8px; margin-bottom: 24px; }

    .ph {
      width: 100%; height: 100%;
      min-height: 200px;
      display: flex; align-items: center; justify-content: center;
      color: #2a2a2a;
      border: 1px dashed #1e1e1e;
    }
  </style>
</head>
<body>
