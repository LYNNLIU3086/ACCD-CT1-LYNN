  <title>TouchDesigner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #999;
      font-family: monospace;
      font-size: 12px;
    }

    nav {
      padding: 32px 40px;
      display: flex;
      justify-content: space-between;
    }

    /* ── Effects grid ── */
    .effects-wrap { margin: 0 40px 80px; }
    .effects {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }

    .effect {
      background: #111;
      text-decoration: none;
      color: inherit;
      display: block;
      cursor: pointer;
    }
    .effect-media {
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      position: relative;
    }
    .effect-media video, .effect-media img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.25s;
    }
    .effect:hover .effect-media img,
    .effect:hover .effect-media video { opacity: 0.6; }
    .effect-media::after {
      content: '↗';
      position: absolute;
      bottom: 12px; right: 14px;
      font-size: 16px;
      color: #fff;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .effect:hover .effect-media::after { opacity: 0.5; }

    .effect-info { padding: 12px 14px 20px; }
    .effect-info span { display: block; margin-bottom: 4px; color: #444; }
    .effect-info p { color: #666; }

    /* ── Projection ── */
    .projection {
      margin: 0 40px 80px;
      display: block;
      text-decoration: none;
      color: inherit;
    }
    .proj-media {
      width: 100%;
      aspect-ratio: 16/6;
      background: #111;
      overflow: hidden;
      position: relative;
    }
    .proj-media video, .proj-media img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.25s;
    }
    .projection:hover .proj-media img,
    .projection:hover .proj-media video { opacity: 0.6; }
    .proj-media::after {
      content: '↗';
      position: absolute;
      bottom: 12px; right: 14px;
      font-size: 16px;
      color: #fff;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .projection:hover .proj-media::after { opacity: 0.5; }

    .proj-info {
      display: flex;
      justify-content: space-between;
      padding: 12px 0 0;
      color: #444;
    }

    .ph {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: #2a2a2a;
      border: 1px dashed #1e1e1e;
    }
  </style>
</head>
