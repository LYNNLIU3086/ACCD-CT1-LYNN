<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>节点显示测试</title>
<style>body{margin:0;overflow:hidden;}</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,20,50);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// 光源
scene.add(new THREE.AmbientLight(0xffffff));

// 节点
const nodes = [
  {id:'1', pos:[-10,0,0]},
  {id:'2', pos:[0,0,0]},
  {id:'3', pos:[10,0,0]}
];
const nodeObjects = {};
nodes.forEach(n=>{
  const geo = new THREE.SphereGeometry(2,32,32);
  const mat = new THREE.MeshStandardMaterial({color:0x0077ff});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(...n.pos);
  scene.add(mesh);
  nodeObjects[n.id] = mesh;
});

// 连线
const links = [
  {source:'1', target:'2'},
  {source:'2', target:'3'}
];
links.forEach(l=>{
  const geo = new THREE.BufferGeometry().setFromPoints([
    nodeObjects[l.source].position,
    nodeObjects[l.target].position
  ]);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({color:0xaaaaaa}));
  scene.add(line);
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
