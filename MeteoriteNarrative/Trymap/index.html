<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meteor Crater Map — JSON Exportable</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#000;color:#fff;padding:24px;}
header{margin-bottom:24px;display:flex;flex-direction:column;gap:12px;}
h1{font-size:32px;}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.search{padding:6px 12px;border:1px solid #555;border-radius:12px;background:transparent;color:#fff;font-size:14px;}
.search::placeholder{color:#888;}
button,label{padding:6px 12px;border-radius:999px;background:#222;color:#ccc;cursor:pointer;font-size:13px;transition:0.2s;border:none;}
button:hover,label:hover{background:#555;color:#fff;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;margin-top:24px;}
.card{background:#111;border:1px solid #222;border-radius:12px;overflow:hidden;cursor:pointer;position:relative;transition:0.2s;}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(255,255,255,0.1);}
.card img{width:100%;height:200px;object-fit:cover;border-bottom:1px solid #222;}
.meta{padding:12px;display:none;}
.meta.editing{display:block;}
.meta .title,.meta .tagsmall{font-size:14px;color:#ccc;margin-bottom:6px;outline:none;}
.del-btn,.rename-btn{position:absolute;top:6px;font-size:14px;padding:2px 4px;border-radius:6px;background:rgba(0,0,0,0.5);}
.del-btn{right:6px;color:#f55;}
.rename-btn{right:30px;color:#fff;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal.show{opacity:1;pointer-events:auto;}
.modal img{max-width:90vw;max-height:80vh;border-radius:12px;}
.close{position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.1);padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:700;color:#fff;}
</style>
</head>
<body>
<header>
<h1>Meteor Crater Map</h1>
<div class="controls">
<input id="search" class="search" placeholder="Search">
<label for="uploader">Upload</label>
<input type="file" id="uploader" multiple style="display:none">
<button id="exportBtn">Export JSON</button>
<label for="importer">Import JSON</label>
<input type="file" id="importer" accept=".json" style="display:none">
</div>
</header>

<main><div class="grid" id="grid"></div></main>

<div class="modal" id="modal">
  <img id="modal-img" src="">
  <div class="close" id="close">✕</div>
</div>

<script>
let initialData = [];
const dbName = 'MeteorCraterDB';
let db;
const request = indexedDB.open(dbName, 1);

request.onupgradeneeded = e => {
  db = e.target.result;
  db.createObjectStore('images', { keyPath: 'id', autoIncrement: true });
};

request.onsuccess = e => {
  db = e.target.result;
  // 自动加载 data.json
  loadFromJSON();
};

// === 自动加载 data.json，如果找不到再用 IndexedDB ===
async function loadFromJSON(){
  try {
    const res = await fetch('data.json');
    if(!res.ok) throw new Error('No data.json found');
    const data = await res.json();
    initialData = data.map((item, idx) => ({id: idx+1, ...item}));
    applyFilter();
  } catch(err){
    console.log('data.json not found, using IndexedDB.');
    loadFromDB();
  }
}

// IndexedDB 数据操作
function saveToDB(item){
  const tx = db.transaction(['images'],'readwrite');
  tx.objectStore('images').put(item);
}
function deleteFromDB(id){
  const tx = db.transaction(['images'],'readwrite');
  tx.objectStore('images').delete(id);
  initialData = initialData.filter(it => it.id !== id);
  applyFilter();
}
function loadFromDB(){
  const tx = db.transaction(['images'],'readonly');
  const req = tx.objectStore('images').getAll();
  req.onsuccess = () => { initialData = req.result; applyFilter(); };
}

// 网格渲染
const grid = document.getElementById('grid');
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modal-img');
const closeBtn = document.getElementById('close');
const searchInput = document.getElementById('search');

function renderGrid(items){
  grid.innerHTML = '';
  if(items.length===0){
    grid.innerHTML='<div style="color:#555;text-align:center;padding:40px;">No images yet.</div>';
    return;
  }
  items.forEach(it=>{
    const card=document.createElement('div'); card.className='card';
    const img=document.createElement('img'); img.src=it.dataSrc;
    const meta=document.createElement('div'); meta.className='meta';
    meta.innerHTML=`<div class='title' contenteditable='true'>${it.title||''}</div>
                    <div class='tagsmall' contenteditable='true'>${it.place||''}</div>`;
    meta.querySelectorAll('[contenteditable]').forEach(el=>{
      el.addEventListener('blur',()=>{
        it.title=meta.querySelector('.title').textContent;
        it.place=meta.querySelector('.tagsmall').textContent;
        saveToDB(it);
      });
    });
    const delBtn=document.createElement('div'); delBtn.className='del-btn'; delBtn.textContent='🗑️';
    delBtn.onclick=e=>{e.stopPropagation();deleteFromDB(it.id);}
    const renameBtn=document.createElement('div'); renameBtn.className='rename-btn'; renameBtn.textContent='✎';
    renameBtn.onclick=e=>{e.stopPropagation();meta.style.display=meta.style.display==='none'?'block':'none';}
    card.append(img,meta,delBtn,renameBtn);
    card.onclick=()=>{modalImg.src=it.dataSrc;modal.classList.add('show');};
    grid.append(card);
  });
}

// 搜索
function applyFilter(){
  const search=searchInput.value.toLowerCase();
  const filtered=initialData.filter(it=>
    (it.title||'').toLowerCase().includes(search)||
    (it.place||'').toLowerCase().includes(search)
  );
  renderGrid(filtered);
}
searchInput.oninput=applyFilter;

// modal
closeBtn.onclick=()=>{modal.classList.remove('show');};
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show');};

// 文件转 Base64
function fileToBase64(file){
  return new Promise(res=>{
    const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file);
  });
}

// 上传图片
document.getElementById('uploader').addEventListener('change',async e=>{
  const files=Array.from(e.target.files);
  for(const f of files){
    const base64=await fileToBase64(f);
    const img=new Image(); img.src=base64;
    img.onload=()=>{
      const ratio=img.naturalWidth/img.naturalHeight;
      const orientation=ratio>1?'landscape':'portrait';
      const item={title:'',place:'',tags:['uploaded',orientation],dataSrc:base64};
      const tx=db.transaction(['images'],'readwrite');
      const store=tx.objectStore('images');
      const req=store.add(item);
      req.onsuccess=e=>{
        item.id=e.target.result;
        initialData.unshift(item);
        applyFilter();
      };
    };
  }
});

// 导出 JSON
document.getElementById('exportBtn').addEventListener('click',()=>{
  const json = JSON.stringify(initialData.map(({id,...rest})=>rest),null,2);
  const blob = new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='data.json';
  a.click();
});

// 导入 JSON
document.getElementById('importer').addEventListener('change',async e=>{
  const file = e.target.files[0];
  if(!file)return;
  const text = await file.text();
  try{
    const data = JSON.parse(text);
    initialData=[];
    const tx = db.transaction(['images'],'readwrite');
    const store = tx.objectStore('images');
    store.clear();
    data.forEach(d=>store.add(d));
    tx.oncomplete=loadFromDB;
  }catch(err){alert('Invalid JSON');}
});

renderGrid(initialData);
</script>
</body>
</html>
